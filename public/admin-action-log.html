<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>higglehaven Admin Action Log</title>
<link rel="stylesheet" href="/admin-action-log.css" />
</head>
<body>
<h1>higglehaven Admin Action Log</h1>
<p class="sub" id="statusLine">Loading…</p>
<p class="err" id="errLine" hidden></p>

<div class="toolbar">
  <input name="actionType" placeholder="Action type (exact)" aria-label="Filter by action type" />
  <input name="targetType" placeholder="Target type (exact)" aria-label="Filter by target type" />
  <input name="adminUserId" placeholder="Admin user id (exact)" aria-label="Filter by admin user id" />
  <input name="targetId" placeholder="Target id (exact)" aria-label="Filter by target id" />
  <button id="filterBtn">Filter</button>
  <button class="secondary" id="clearBtn">Clear</button>
  <button class="secondary" id="refreshBtn">Refresh</button>
</div>

<div id="tableWrap"></div>

<script src="/admin-action-log.js"></script>
</body>
</html>
