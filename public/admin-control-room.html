<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>higglehaven Control Room</title>
<link rel="stylesheet" href="/admin-control-room.css" />
</head>
<body>
<h1>higglehaven Control Room</h1>
<p class="sub" id="statusLine">Loading…</p>
<p class="err" id="errLine" hidden></p>

<div class="compose">
  <div class="compose-row">
    <input name="from" placeholder="From" value="owner" aria-label="From" />
    <select name="kind" aria-label="Message kind">
      <option value="feedback">feedback</option>
      <option value="question">question</option>
    </select>
    <textarea name="title" placeholder="New message / direction…" rows="1"></textarea>
    <button id="composeBtn">Post</button>
  </div>
</div>

<div class="compose">
  <div class="compose-row">
    <input type="email" id="grantAdminEmail" placeholder="Account email to make admin" aria-label="Account email to make admin" style="flex: 1 1 260px;" />
    <button id="grantAdminBtn">Grant admin</button>
  </div>
  <p class="meta" id="grantAdminStatus" style="margin: 6px 0 0;"></p>
  <div style="margin-top: 10px; border-top: 1px solid #eef1e8; padding-top: 10px;">
    <div class="compose-row" style="align-items: center; justify-content: space-between;">
      <strong style="font-size: 13px;">Current admins</strong>
      <button class="secondary" id="refreshAdminsBtn">Refresh</button>
    </div>
    <div id="adminsList" class="meta" style="margin-top: 6px;">Loading…</div>
  </div>
</div>

<div class="toolbar">
  <input type="search" id="search" placeholder="Search title, note, session, tag…" aria-label="Search title, note, session, tag" />
</div>
<div class="tabs" id="tabs">
  <button data-status="" class="active">All</button>
  <button data-status="queued">Queued</button>
  <button data-status="in_progress">In progress</button>
  <button data-status="done">Done</button>
  <button data-status="__quicklook__">Quick Look</button>
</div>

<div id="list"></div>

<script src="/admin-control-room.js"></script>
</body>
</html>
