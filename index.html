<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>higglehaven (dev)</title>
    <style>
      /* Shared brand colors for every translucent UI pill. --pill-rgb is a
         dark, desaturated version of the wordmark's green (rather than
         plain black) so product-info, the gizmo buttons, etc. all read as
         "this app" instead of a generic gray overlay. Space-separated RGB
         so each usage can pick its own alpha via rgb(var(--pill-rgb) / a). */
      :root {
        --pill-rgb: 36, 56, 20;
        --brand-green: #6ca42e;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #111;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #build-info {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: rgba(255, 255, 255, 0.75);
        font: 12px/1.4 monospace;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        z-index: 10;
      }
      /* The wordmark's own green-on-transparent art has no contrast
         guarantee against an arbitrary background — great against the
         ground plane and most products, unreadable against the sky. Same
         translucent-dark-pill treatment as every other text overlay
         (#product-info, the gizmo buttons, ...) fixes that uniformly,
         since it controls the pixels immediately behind the logo instead
         of depending on whatever happens to be in the 3D scene there. */
      #wordmark-panel {
        position: fixed;
        top: 10px;
        left: 12px;
        z-index: 10;
        pointer-events: none;
        background: rgb(var(--pill-rgb) / 0.55);
        border-radius: 8px;
        padding: 4px 10px;
        display: flex;
        align-items: center;
      }
      #wordmark {
        height: 26px;
        width: auto;
        display: block;
      }
      /* #product-info is centered and can grow wide enough (its "Tap a
         product to inspect it" hint text especially) to reach the
         wordmark's corner on narrow phone screens — shrink the wordmark
         there rather than fight over the same space. */
      @media (max-width: 480px) {
        #wordmark {
          height: 18px;
        }
        #wordmark-panel {
          padding: 3px 8px;
        }
      }
      #camera-debug-panel {
        position: fixed;
        bottom: 44px;
        right: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      #camera-debug {
        color: rgba(255, 255, 255, 0.75);
        font: 11px/1.4 monospace;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        text-align: right;
        white-space: pre;
        user-select: text;
        -webkit-user-select: text;
      }
      #camera-debug-copy {
        padding: 3px 10px;
        border-radius: 6px;
        border: none;
        background: rgb(var(--pill-rgb) / 0.6);
        color: rgba(255, 255, 255, 0.85);
        font: 11px/1.4 sans-serif;
      }
      #product-info {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgb(var(--pill-rgb) / 0.65);
        padding: 8px 14px;
        border-radius: 8px;
        font: 14px/1.4 sans-serif;
        text-align: center;
        pointer-events: none;
        z-index: 10;
      }
      #gizmo-mode-controls {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 94vw;
        gap: 8px;
        z-index: 10;
      }
      #gizmo-mode-controls.visible {
        display: flex;
      }
      #gizmo-mode-controls button {
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        background: rgb(var(--pill-rgb) / 0.5);
        color: rgba(255, 255, 255, 0.8);
        font: 14px/1.4 sans-serif;
      }
      #gizmo-mode-controls button.active {
        background: var(--brand-green);
        color: #16240a;
      }
      #delete-item {
        background: rgba(140, 20, 20, 0.55);
        color: #fff;
      }
      #add-item-panel {
        position: fixed;
        bottom: 44px;
        left: 8px;
        z-index: 10;
        display: flex;
        /* Reversed so the catalog picker opens upward, above the button,
           since the panel is anchored to the bottom of the screen. */
        flex-direction: column-reverse;
        gap: 8px;
      }
      #add-item-btn {
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        background: rgb(var(--pill-rgb) / 0.65);
        color: #fff;
        font: 14px/1.4 sans-serif;
        align-self: flex-start;
      }
      #catalog-picker {
        display: none;
        flex-direction: column;
        gap: 6px;
        background: rgb(var(--pill-rgb) / 0.65);
        border-radius: 10px;
        padding: 8px;
      }
      #catalog-picker.visible {
        display: flex;
      }
      #catalog-picker button {
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        background: rgb(255 255 255 / 0.15);
        color: #fff;
        font: 14px/1.4 sans-serif;
        text-align: left;
      }
      #upload-model-btn,
      #toggle-multiselect,
      #paste-btn {
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        background: rgb(var(--pill-rgb) / 0.65);
        color: #fff;
        font: 14px/1.4 sans-serif;
        align-self: flex-start;
      }
      #toggle-multiselect.active {
        background: var(--brand-green);
        color: #16240a;
      }
      #paste-btn:disabled {
        opacity: 0.4;
      }
      #upload-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 0.5);
        padding: 16px;
      }
      #upload-modal.visible {
        display: flex;
      }
      #upload-modal-content {
        width: 100%;
        max-width: 360px;
        max-height: 90vh;
        overflow-y: auto;
        background: rgb(var(--pill-rgb) / 0.97);
        border-radius: 14px;
        padding: 18px;
        color: #fff;
        font: 14px/1.4 sans-serif;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #upload-modal-content h2 {
        margin: 0;
        font-size: 17px;
      }
      #upload-modal-content label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        color: rgb(255 255 255 / 0.85);
      }
      #upload-modal-content input[type='text'] {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid rgb(255 255 255 / 0.25);
        background: rgb(255 255 255 / 0.1);
        color: #fff;
        font: 14px/1.4 sans-serif;
      }
      #upload-hint {
        font-size: 12px;
        color: rgb(255 255 255 / 0.65);
      }
      #upload-status {
        font-size: 13px;
        min-height: 18px;
      }
      #upload-status.error {
        color: #ffb4a8;
      }
      #upload-modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      #upload-modal-actions button {
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        font: 14px/1.4 sans-serif;
      }
      #upload-cancel-btn {
        background: rgb(255 255 255 / 0.15);
        color: #fff;
      }
      #upload-submit-btn {
        background: var(--brand-green);
        color: #16240a;
      }
      #upload-submit-btn:disabled {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="wordmark-panel">
      <img id="wordmark" src="/wordmark.png" alt="higglehaven" />
    </div>
    <div id="build-info"></div>
    <div id="camera-debug-panel">
      <div id="camera-debug"></div>
      <button id="camera-debug-copy" type="button">Copy</button>
    </div>
    <div id="product-info"></div>
    <div id="gizmo-mode-controls">
      <button id="mode-move" type="button">Move</button>
      <button id="mode-rotate" type="button">Rotate</button>
      <button id="toggle-snap" type="button">Snap</button>
      <button id="copy-item" type="button">Copy</button>
      <button id="delete-item" type="button">Delete</button>
    </div>
    <div id="add-item-panel">
      <button id="add-item-btn" type="button">+ Add Item</button>
      <button id="upload-model-btn" type="button">+ Upload Model</button>
      <button id="toggle-multiselect" type="button">Multi-Select</button>
      <button id="paste-btn" type="button" disabled>Paste</button>
      <div id="catalog-picker"></div>
    </div>
    <div id="upload-modal">
      <div id="upload-modal-content">
        <h2>Add a custom product</h2>
        <label>
          Name
          <input id="upload-name" type="text" placeholder="e.g. Brick" />
        </label>
        <label id="upload-file-label">
          .glb file
          <input id="upload-file-input" type="file" accept=".glb,model/gltf-binary" />
        </label>
        <div id="upload-hint">
          We'll automatically reduce its geometry and texture detail before uploading — typically shrinks it by
          80&ndash;95%. Pick anything up to 20MB; smaller starting files optimize faster.
        </div>
        <div id="upload-status"></div>
        <div id="upload-modal-actions">
          <button id="upload-cancel-btn" type="button">Cancel</button>
          <button id="upload-submit-btn" type="button">Add Product</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
