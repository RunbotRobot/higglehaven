<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>higglehaven (dev)</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #111;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #build-info {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: rgba(255, 255, 255, 0.75);
        font: 12px/1.4 monospace;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        z-index: 10;
      }
      #product-info {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 14px;
        border-radius: 8px;
        font: 14px/1.4 sans-serif;
        text-align: center;
        pointer-events: none;
        z-index: 10;
      }
      #rotate-controls {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        gap: 12px;
        z-index: 10;
      }
      #rotate-controls.visible {
        display: flex;
      }
      #rotate-controls button {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 20px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="build-info"></div>
    <div id="product-info"></div>
    <div id="rotate-controls">
      <button id="rotate-left" type="button" aria-label="Rotate left">⟲</button>
      <button id="rotate-right" type="button" aria-label="Rotate right">⟳</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
