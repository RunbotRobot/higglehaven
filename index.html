<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>higglehaven (dev)</title>
    <style>
      /* Shared brand colors for every translucent UI pill. --pill-rgb is a
         dark, desaturated version of the wordmark's green (rather than
         plain black) so product-info, the gizmo buttons, etc. all read as
         "this app" instead of a generic gray overlay. Space-separated RGB
         so each usage can pick its own alpha via rgb(var(--pill-rgb) / a). */
      :root {
        --pill-rgb: 36, 56, 20;
        --brand-green: #6ca42e;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #111;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #build-info {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: rgba(255, 255, 255, 0.75);
        font: 12px/1.4 monospace;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        z-index: 10;
      }
      /* The wordmark's own green-on-transparent art has no contrast
         guarantee against an arbitrary background — great against the
         ground plane and most products, unreadable against the sky. Same
         translucent-dark-pill treatment as every other text overlay
         (#product-info, the gizmo buttons, ...) fixes that uniformly,
         since it controls the pixels immediately behind the logo instead
         of depending on whatever happens to be in the 3D scene there. */
      #wordmark-panel {
        position: fixed;
        top: 10px;
        left: 12px;
        z-index: 10;
        pointer-events: none;
        background: rgb(var(--pill-rgb) / 0.55);
        border-radius: 8px;
        padding: 4px 10px;
        display: flex;
        align-items: center;
      }
      #wordmark {
        height: 26px;
        width: auto;
        display: block;
      }
      /* #product-info is centered and can grow wide enough (its "Tap a
         product to inspect it" hint text especially) to reach the
         wordmark's corner on narrow phone screens — shrink the wordmark
         there rather than fight over the same space. */
      @media (max-width: 480px) {
        #wordmark {
          height: 18px;
        }
        #wordmark-panel {
          padding: 3px 8px;
        }
      }
      #camera-debug-panel {
        position: fixed;
        bottom: 44px;
        right: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      #camera-debug {
        color: rgba(255, 255, 255, 0.75);
        font: 11px/1.4 monospace;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        text-align: right;
        white-space: pre;
        user-select: text;
        -webkit-user-select: text;
      }
      #camera-debug-copy {
        padding: 3px 10px;
        border-radius: 6px;
        border: none;
        background: rgb(var(--pill-rgb) / 0.6);
        color: rgba(255, 255, 255, 0.85);
        font: 11px/1.4 sans-serif;
      }
      #product-info {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgb(var(--pill-rgb) / 0.65);
        padding: 8px 14px;
        border-radius: 8px;
        font: 14px/1.4 sans-serif;
        text-align: center;
        pointer-events: none;
        z-index: 10;
      }
      #gizmo-mode-controls {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        gap: 8px;
        z-index: 10;
      }
      #gizmo-mode-controls.visible {
        display: flex;
      }
      #gizmo-mode-controls button {
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        background: rgb(var(--pill-rgb) / 0.5);
        color: rgba(255, 255, 255, 0.8);
        font: 14px/1.4 sans-serif;
      }
      #gizmo-mode-controls button.active {
        background: var(--brand-green);
        color: #16240a;
      }
      #delete-item {
        background: rgba(140, 20, 20, 0.55);
        color: #fff;
      }
      #add-item-panel {
        position: fixed;
        bottom: 44px;
        left: 8px;
        z-index: 10;
        display: flex;
        /* Reversed so the catalog picker opens upward, above the button,
           since the panel is anchored to the bottom of the screen. */
        flex-direction: column-reverse;
        gap: 8px;
      }
      #add-item-btn {
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        background: rgb(var(--pill-rgb) / 0.65);
        color: #fff;
        font: 14px/1.4 sans-serif;
        align-self: flex-start;
      }
      #catalog-picker {
        display: none;
        flex-direction: column;
        gap: 6px;
        background: rgb(var(--pill-rgb) / 0.65);
        border-radius: 10px;
        padding: 8px;
      }
      #catalog-picker.visible {
        display: flex;
      }
      #catalog-picker button {
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        background: rgb(255 255 255 / 0.15);
        color: #fff;
        font: 14px/1.4 sans-serif;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="wordmark-panel">
      <img id="wordmark" src="/wordmark.png" alt="higglehaven" />
    </div>
    <div id="build-info"></div>
    <div id="camera-debug-panel">
      <div id="camera-debug"></div>
      <button id="camera-debug-copy" type="button">Copy</button>
    </div>
    <div id="product-info"></div>
    <div id="gizmo-mode-controls">
      <button id="mode-move" type="button">Move</button>
      <button id="mode-rotate" type="button">Rotate</button>
      <button id="toggle-snap" type="button">Snap</button>
      <button id="delete-item" type="button">Delete</button>
    </div>
    <div id="add-item-panel">
      <button id="add-item-btn" type="button">+ Add Item</button>
      <div id="catalog-picker"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
