name: CI

# Runs on GitHub's own runners, not the developer's machine — the whole
# point is that pushing doesn't block local work on either suite. Two
# independent jobs (rather than one job running both suites in sequence)
# so they execute in parallel here too, not just "off your machine."
#
# push only, deliberately no separate `pull_request` trigger: every branch
# here lives in this same repo (no forks), so a `pull_request` event's
# commit is always one `push` has already tested — with several sessions
# each pushing to their own branch with an open PR, that meant every
# commit ran the entire suite twice for no reason, competing for the same
# limited pool of runner slots. GitHub still shows a PR's mergeability
# using the push-triggered run's checks — they're tied to the commit SHA,
# not the event that produced them, confirmed by hand (a PR's check list
# already included its branch's push-triggered run before this change).
#
# paths-ignore skips the whole workflow for a push that only touches
# Markdown — a docs-only commit (several sessions have made plenty of
# these fixing stale comments) has no code path that could possibly need
# either suite, so it isn't worth a ~7-job fan-out competing for the same
# runner slots every other push is drawing from.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'

# Cancels a branch's own earlier, now-superseded run the moment a newer push
# lands on it — without this, every push's full ~23-job fan-out (unit-tests +
# discover-e2e-files + ~21 e2e matrix entries) kept running to completion even
# after a later push made it moot, which is exactly what several sessions
# hit as runner-pool contention when iterating with multiple pushes per
# branch. Scoped per-branch (github.ref), so it only ever cancels a branch's
# own stale run — never another session's branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #2990: two routine fleet habits push a commit whose SHA `main` has
  # already tested in full — the merge commit, pushed right back to the
  # session branch after merging a PR, and a session branch reset to
  # main's own tip at the start of its next cycle (AGENTS.md's own step
  # 1). Neither is a push to `main` itself, and neither carries any commit
  # main hasn't already run the whole suite against, so re-running
  # unit-tests/discover-e2e-files/e2e-tests for either is pure wasted
  # runner-pool contention — confirmed via actions_list, ~40% of
  # concurrently-running jobs at one snapshot were exactly this. Skips by
  # checking whether the pushed SHA is already reachable from origin/main
  # (merge-base --is-ancestor), which is true for both habits above and
  # false for any push that carries real, not-yet-tested work — including
  # a push to main itself, excluded outright by the ref check so main's
  # own commits are never skipped (nothing else validates them).
  already-tested:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          git fetch origin main
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "This SHA is already reachable from origin/main -- skipping the redundant re-run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fully self-contained — vitest.config.js hardcodes a fixed test
      # ADMIN_BOOTSTRAP_SECRET for the Workers pool, so this needs no
      # .dev.vars/secrets setup at all (see that file's own comment).
      - run: npm test

  # e2e/run-all.mjs runs whichever files it's given one at a time on
  # purpose — a shared local D1 across files exhausts the claimable-land
  # pool (see that file's own comment), so each file needs a genuinely
  # fresh D1, not just a fresh browser page. In CI, "fresh D1 per file"
  # falls out for free the moment two files run on separate VMs at all —
  # it doesn't require a separate VM *per file*. Sharded into a handful of
  # groups (SHARD_COUNT below) rather than one job per file: with several
  # sessions now pushing to their own branches in parallel, one job per
  # file (~21 of them, +unit-tests +discover-e2e-files) meant a single
  # push alone could exceed this account's entire 20-job concurrent-runner
  # budget (GitHub Free plan, account-wide, not per-repo) — every other
  # session's push then queued behind it for real wall-clock minutes, not
  # seconds. Shards land wall-clock speed a bit slower than one-job-per-
  # file, in exchange for actually leaving room for more than one
  # session's push to run at once, which is the thing that was genuinely
  # constrained. Adjust SHARD_COUNT if that trade-off ever needs revisiting
  # — it's the one number that governs it, no other change needed as
  # e2e/*.test.mjs grows.
  discover-e2e-files:
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      SHARD_COUNT: 4
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # #3003: groups e2e/*.test.mjs into SHARD_COUNT shards balanced by
      # measured per-file duration (scripts/bin-pack-e2e-shards.mjs's own
      # LPT bin-packing, reading e2e/shard-weights.json), not by plain
      # alphabetical file count — equal count != equal time, and the
      # previous equal-count split put every admin-dashboard suite
      # (alphabetically first, also the heaviest files in the repo) in one
      # shard that ran ~2x longer than its siblings, past every patience
      # threshold the fleet had been using, so it kept getting killed and
      # re-queued into the same already-contended pool. See that script's
      # own header comment for the full design (LPT heuristic, median
      # fallback for an unmeasured file, uniform-weight/count-based
      # fallback when the snapshot has no data at all) and
      # scripts/update-shard-weights.mjs for how the snapshot itself gets
      # refreshed from a real run's job logs.
      #
      # purchase-checkout-real-stripe.test.mjs (#2861) still gets pulled
      # out into its own dedicated shard regardless of weight — see that
      # script's own ISOLATED_FILE comment for why (PR #2874's own
      # #2673-flake-rate finding).
      - id: list
        run: |
          shards=$(node scripts/bin-pack-e2e-shards.mjs)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  e2e-tests:
    # #2990: no explicit already-tested check needed here -- GitHub skips
    # a job automatically once any of its own needs (discover-e2e-files,
    # transitively already-tested) is itself skipped rather than
    # succeeded, since this job's implicit condition is success().
    needs: discover-e2e-files
    runs-on: ubuntu-latest
    # #2859: Stripe test-mode credentials for e2e/verify-card-real-stripe.test.mjs
    # -- the ONLY file that reads these (e2e/run-all.mjs's own
    # REAL_STRIPE_TEST_FILES gate), passed through to wrangler dev for that
    # one spawn via --var, never written into the shared .dev.vars every
    # other file's wrangler dev also reads. Deliberately separate secrets
    # from the live STRIPE_SECRET_KEY/STRIPE_PUBLISHABLE_KEY Worker secrets --
    # don't confuse the two or wire test keys into the production Worker.
    # Absent on a fork PR (secrets aren't exposed to those) or before the
    # owner provisions them -- that file's own guard just skips in either
    # case rather than failing the shard.
    env:
      E2E_STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      E2E_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
    strategy:
      # One shard failing shouldn't cancel the others still in flight —
      # fail-fast would hide exactly the information a growing suite most
      # needs from a CI run: which of several regressions, not just the
      # first one GitHub happened to notice.
      fail-fast: false
      matrix:
        files: ${{ fromJson(needs.discover-e2e-files.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest ships Google's own Chrome apt repo pre-registered
      # (for a system Chrome install this workflow never uses) — but
      # --with-deps chromium below only needs apt to resolve shared-library
      # runtime deps (libnss3, libatk, etc.), never anything actually
      # fetched *from* that repo. Any apt-get update still hits it anyway
      # as long as its source is present, and confirmed via job logs
      # (PR #611, runs 34384027836/34385033854/34385292940 — 12 shard
      # failures across three separate pushes, all identical) that
      # dl.google.com's own CDN can serve an inconsistent package index
      # ("Hash Sum mismatch") for well over 30 minutes straight, outlasting
      # a short in-job retry. Matching by content (dl.google.com), not a
      # guessed filename -- guessing google-chrome.list here first (the
      # classic name Google's own installer normally uses) didn't actually
      # match whatever this runner image's own source file is really
      # called, confirmed by the exact same fetch still happening after
      # that rm. Dropping whichever file it actually is removes the
      # dependency on that repo's health entirely, rather than betting the
      # outage clears in time.
      - run: sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
      # Retries once on failure too, same rationale/shape as the shard
      # retry below, as a fallback for any other transient apt/network
      # issue this step's install-deps step might still hit.
      - run: |
          for attempt in 1 2; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt of playwright install failed — retrying after a short pause in case it was an apt-mirror hiccup..." >&2
            sleep 10
          done
          echo "playwright install failed twice — treating as a real failure, not a transient one." >&2
          exit 1
      # .dev.vars is gitignored (wrangler's standard local-only-override
      # mechanism — see docs/API.md's own note on it), so CI recreates the
      # one value e2e/run-all.mjs's own wrangler dev needs. Not a real
      # secret: this exact value is already a well-known dev-only fixture,
      # visible in plaintext in this repo's own code comments (see
      # e2e/helpers.mjs's ADMIN_BOOTSTRAP_SECRET fallback) — nothing this
      # unlocks exists outside each ephemeral CI run's own throwaway D1.
      # 127.0.0.1, not localhost, to match e2e/run-all.mjs and
      # e2e/helpers.mjs's own BASE_URL — see run-all.mjs's comment on the
      # dual-stack DNS race a hostname would otherwise be exposed to.
      # Mismatched origins here would also break auth.test.mjs's own
      # verify/reset-link flow (the dev-mode link this embeds is a
      # different origin's cookie jar if the two don't agree).
      - run: |
          echo "APP_BASE_URL=http://127.0.0.1:8787" > .dev.vars
          echo "ADMIN_BOOTSTRAP_SECRET=local-dev-admin-secret" >> .dev.vars
          # #1231: not a real secret -- a dev-only test seam flag (see
          # worker/index.js's handleInstancePurchase, where this is read)
          # that only ever does anything when STRIPE_SECRET_KEY is also
          # unset, which is already always true in this job.
          echo "E2E_SIMULATE_PAID_PURCHASES=true" >> .dev.vars
      # Retries the whole shard once on failure. Confirmed (via captured
      # wrangler dev server output — see e2e/run-all.mjs's own comment on
      # that capture) that occasional failures here are GitHub's shared
      # runners themselves stalling under load: a request that normally
      # takes 10-70ms takes 400-1500ms, sometimes crossing into workerd's
      # own internal error and a dead connection for everything after.
      # Real bugs this suite has caught (a real regression, a genuine test
      # race) have always reproduced identically on retry; this transient
      # class hasn't reproduced once when simply run again. A retry here
      # re-runs every file in the shard, not just whichever one hit it —
      # run-all.mjs doesn't track that distinction, and with only a
      # handful of files per shard the redundant re-runs cost is small
      # next to what per-file granularity would cost in job count.
      - run: |
          for attempt in 1 2; do
            if node e2e/run-all.mjs ${{ join(matrix.files, ' ') }}; then
              exit 0
            fi
            echo "Attempt $attempt of this shard failed — retrying after a short pause in case it was runner-load-related..." >&2
            sleep 10
          done
          echo "This shard failed twice — treating as a real failure, not a transient one." >&2
          exit 1
      # #2965: the step above only ever diagnoses an ordinary test *failure*
      # -- e2e/run-all.mjs's own wrangler-crash-log capture (see that file's
      # #2673 comment) runs inside each test file's own try/catch, triggered
      # by that file's wrangler dev exiting with a bad status. A *hang*
      # instead gets recovered by cancelling the whole job from outside
      # (GitHub Actions UI/API, or this account's own tooling) -- confirmed
      # for real on run 41264803797 / job 124725374350 (2026-11-01): the
      # in-process mechanism fired correctly earlier in that exact job for
      # an ordinary failure (a full wrangler-crash-log excerpt was printed
      # for shop-idle-sit-randomization.test.mjs), but once a later test hung
      # and the job was cancelled, the log just stops at "The operation was
      # canceled" with zero diagnostic -- the hanging file's own wrangler
      # dev process was still alive, so run-all.mjs's per-file catch block,
      # and its end-of-run summary print (which only runs after every file
      # in the shard has completed), never got a chance to execute. This
      # step runs independently of that process's own state, reading
      # wrangler's on-disk debug log directly from the workflow -- GitHub
      # still runs steps conditioned on cancelled() after a cancellation
      # (confirmed by that same job's own "Post job cleanup" steps
      # completing right after it was cancelled). Limited to the most
      # recently modified file(s): by the time of a hang this directory can
      # hold one file per already-finished test in the shard, but the
      # hanging test's own wrangler dev is always among the newest by mtime
      # since it's the one still writing when the job gets killed.
      - name: Capture wrangler dev crash log on hang/cancellation (fallback for #2673)
        if: failure() || cancelled()
        run: |
          LOG_DIR="$HOME/.config/.wrangler/logs"
          if [ ! -d "$LOG_DIR" ]; then
            echo "No wrangler log directory found at $LOG_DIR"
            exit 0
          fi
          newest=$(ls -t "$LOG_DIR"/*.log 2>/dev/null | head -n 2)
          if [ -z "$newest" ]; then
            echo "wrangler log directory exists but has no .log files"
            exit 0
          fi
          for f in $newest; do
            echo "::group::wrangler dev log (most recently modified): $f"
            tail -c 50000 "$f"
            echo "::endgroup::"
          done
