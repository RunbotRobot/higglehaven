name: CI

# Runs on GitHub's own runners, not the developer's machine — the whole
# point is that pushing doesn't block local work on either suite. Two
# independent jobs (rather than one job running both suites in sequence)
# so they execute in parallel here too, not just "off your machine."
#
# push only, deliberately no separate `pull_request` trigger: every branch
# here lives in this same repo (no forks), so a `pull_request` event's
# commit is always one `push` has already tested — with several sessions
# each pushing to their own branch with an open PR, that meant every
# commit ran the entire suite twice for no reason, competing for the same
# limited pool of runner slots. GitHub still shows a PR's mergeability
# using the push-triggered run's checks — they're tied to the commit SHA,
# not the event that produced them, confirmed by hand (a PR's check list
# already included its branch's push-triggered run before this change).
#
# paths-ignore skips the whole workflow for a push that only touches
# Markdown — a docs-only commit (several sessions have made plenty of
# these fixing stale comments) has no code path that could possibly need
# either suite, so it isn't worth a ~7-job fan-out competing for the same
# runner slots every other push is drawing from.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'

# Cancels a branch's own earlier, now-superseded run the moment a newer push
# lands on it — without this, every push's full ~23-job fan-out (unit-tests +
# discover-e2e-files + ~21 e2e matrix entries) kept running to completion even
# after a later push made it moot, which is exactly what several sessions
# hit as runner-pool contention when iterating with multiple pushes per
# branch. Scoped per-branch (github.ref), so it only ever cancels a branch's
# own stale run — never another session's branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fully self-contained — vitest.config.js hardcodes a fixed test
      # ADMIN_BOOTSTRAP_SECRET for the Workers pool, so this needs no
      # .dev.vars/secrets setup at all (see that file's own comment).
      - run: npm test

  # e2e/run-all.mjs runs whichever files it's given one at a time on
  # purpose — a shared local D1 across files exhausts the claimable-land
  # pool (see that file's own comment), so each file needs a genuinely
  # fresh D1, not just a fresh browser page. In CI, "fresh D1 per file"
  # falls out for free the moment two files run on separate VMs at all —
  # it doesn't require a separate VM *per file*. Sharded into a handful of
  # groups (SHARD_COUNT below) rather than one job per file: with several
  # sessions now pushing to their own branches in parallel, one job per
  # file (~21 of them, +unit-tests +discover-e2e-files) meant a single
  # push alone could exceed this account's entire 20-job concurrent-runner
  # budget (GitHub Free plan, account-wide, not per-repo) — every other
  # session's push then queued behind it for real wall-clock minutes, not
  # seconds. Shards land wall-clock speed a bit slower than one-job-per-
  # file, in exchange for actually leaving room for more than one
  # session's push to run at once, which is the thing that was genuinely
  # constrained. Adjust SHARD_COUNT if that trade-off ever needs revisiting
  # — it's the one number that governs it, no other change needed as
  # e2e/*.test.mjs grows.
  discover-e2e-files:
    runs-on: ubuntu-latest
    env:
      SHARD_COUNT: 4
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      # Groups e2e/*.test.mjs into SHARD_COUNT roughly-even chunks (plain
      # array slicing, not a jq builtin, so this doesn't depend on exactly
      # which jq version a runner image happens to ship) — computed at run
      # time from whatever files actually exist, not hardcoded, so a newly
      # added e2e/*.test.mjs file is automatically covered next push.
      - id: list
        run: |
          files=$(ls e2e/*.test.mjs | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
          count=$(echo "$files" | jq 'length')
          size=$(( (count + SHARD_COUNT - 1) / SHARD_COUNT ))
          shards=$(echo "$files" | jq -c --argjson size "$size" '[range(0; length; $size) as $i | .[$i:$i+$size]]')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: discover-e2e-files
    runs-on: ubuntu-latest
    strategy:
      # One shard failing shouldn't cancel the others still in flight —
      # fail-fast would hide exactly the information a growing suite most
      # needs from a CI run: which of several regressions, not just the
      # first one GitHub happened to notice.
      fail-fast: false
      matrix:
        files: ${{ fromJson(needs.discover-e2e-files.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # .dev.vars is gitignored (wrangler's standard local-only-override
      # mechanism — see docs/API.md's own note on it), so CI recreates the
      # one value e2e/run-all.mjs's own wrangler dev needs. Not a real
      # secret: this exact value is already a well-known dev-only fixture,
      # visible in plaintext in this repo's own code comments (see
      # e2e/helpers.mjs's ADMIN_BOOTSTRAP_SECRET fallback) — nothing this
      # unlocks exists outside each ephemeral CI run's own throwaway D1.
      # 127.0.0.1, not localhost, to match e2e/run-all.mjs and
      # e2e/helpers.mjs's own BASE_URL — see run-all.mjs's comment on the
      # dual-stack DNS race a hostname would otherwise be exposed to.
      # Mismatched origins here would also break auth.test.mjs's own
      # verify/reset-link flow (the dev-mode link this embeds is a
      # different origin's cookie jar if the two don't agree).
      - run: |
          echo "APP_BASE_URL=http://127.0.0.1:8787" > .dev.vars
          echo "ADMIN_BOOTSTRAP_SECRET=local-dev-admin-secret" >> .dev.vars
      # Retries the whole shard once on failure. Confirmed (via captured
      # wrangler dev server output — see e2e/run-all.mjs's own comment on
      # that capture) that occasional failures here are GitHub's shared
      # runners themselves stalling under load: a request that normally
      # takes 10-70ms takes 400-1500ms, sometimes crossing into workerd's
      # own internal error and a dead connection for everything after.
      # Real bugs this suite has caught (a real regression, a genuine test
      # race) have always reproduced identically on retry; this transient
      # class hasn't reproduced once when simply run again. A retry here
      # re-runs every file in the shard, not just whichever one hit it —
      # run-all.mjs doesn't track that distinction, and with only a
      # handful of files per shard the redundant re-runs cost is small
      # next to what per-file granularity would cost in job count.
      - run: |
          for attempt in 1 2; do
            if node e2e/run-all.mjs ${{ join(matrix.files, ' ') }}; then
              exit 0
            fi
            echo "Attempt $attempt of this shard failed — retrying after a short pause in case it was runner-load-related..." >&2
            sleep 10
          done
          echo "This shard failed twice — treating as a real failure, not a transient one." >&2
          exit 1
