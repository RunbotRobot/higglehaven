name: Backup mirror to GitLab

# Keeps an independent, off-GitHub copy of this repo in sync — insurance
# against GitHub-account-level disasters (a bad force-push wiping history,
# a repo/branch deletion, account lockout), not against ordinary git
# mistakes, which GitHub's own commit-immutability already protects
# against. Runs on its own nightly schedule, deliberately not on every
# push, so it never competes with ci.yml's own runner-pool usage.
#
# Fast-forward only, on purpose: this pushes `main` and tags individually
# (`refs/heads/main:refs/heads/main`, `refs/tags/*:refs/tags/*`) with no
# `--force` and never `git push --mirror` (which forces by default). A
# normal push creates new branches and fast-forwards existing ones fine,
# but simply fails if a branch's history was ever rewritten backwards
# (a force-push) — so a disaster on GitHub can't get silently copied over
# and overwrite the one clean copy sitting on GitLab.
#
# Scoped to `main` specifically, not `refs/heads/*` (#1307): per AGENTS.md's
# per-session branch convention, every `higglehavenN`/`claude/higglehavenN-*`
# branch is deliberately reset to main's tip at the start of each work cycle
# — a routine, intentional non-fast-forward, not a disaster. Mirroring those
# too meant this job failed every night on exactly that, which both carries
# no disaster-recovery value (anything durable in them is already in `main`
# once merged) and masked whether a real problem with `main` itself would
# even be noticed.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror-clone from GitHub
        run: git clone --mirror https://github.com/${{ github.repository }}.git mirror.git

      - name: Fast-forward-only push to GitLab
        working-directory: mirror.git
        run: |
          git push "https://oauth2:${{ secrets.GITLAB_BACKUP_TOKEN }}@gitlab.com/higglehaven-group/higglehaven.git" \
            'refs/heads/main:refs/heads/main' 'refs/tags/*:refs/tags/*'
